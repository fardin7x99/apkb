name: Build APK and Update Firebase

# যখনই ওয়েবাসাইট থেকে index.html ফাইলটি আপডেট হবে, তখনই বিল্ড শুরু হবে
on:
  push:
    paths:
      - 'app/src/main/assets/index.html'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK (Installable)
        run: ./gradlew assembleDebug

      - name: Upload APK to GitHub Releases
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          tag_name: v1.0.${{ github.run_number }}
          name: App Release v1.0.${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Download Link to Firebase Database
        run: |
          # ফায়ারবেস ডাটাবেজে লিংক আপডেট করবে (আপনার প্রোজেক্ট আইডি অনুযায়ী)
          curl -X PUT -d '"https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/app-debug.apk"' "https://apk-builder-fe71d-default-rtdb.firebaseio.com/builds/latest/downloadUrl.json"
          curl -X PUT -d '"Completed"' "https://apk-builder-fe71d-default-rtdb.firebaseio.com/builds/latest/status.json"
